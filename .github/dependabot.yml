version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/FeatureFlags"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/FeatureFlags.Tests"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      nuget-test-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
